<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>Evernight的小站 - Moved</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      color: #333;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      text-align: center;
      padding: 24px;
      max-width: 480px;
      width: 100%;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 12px;
    }

    p {
      margin-bottom: 8px;
      font-size: 1rem;
      line-height: 1.5;
    }

    .subtitle {
      margin-bottom: 20px;
      color: #666;
    }

    .btn {
      display: inline-block;
      margin-top: 16px;
      padding: 10px 20px;
      font-size: 1rem;
      text-decoration: none;
      border-radius: 999px;
      border: none;
      background: #007bff;
      color: #fff;
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.2s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
    }

    .btn:active {
      transform: translateY(1px);
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
    }

    .btn:hover {
      background: #0063cc;
    }

    .footer {
      margin-top: 24px;
      font-size: 0.85rem;
      color: #999;
    }

    /* 小螢幕字體稍微放大一點 */
    @media (max-width: 480px) {
      h1 {
        font-size: 2.4rem;
      }
      p {
        font-size: 1.05rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>已遷移！Moved!</h1>
    <p class="subtitle">PenTiSim已移動至/ptsm.點擊下面的按鈕訪問新連結。
    PenTiSim has moved to /ptsm. Click the button below to jump to updated page.</p>

    <a class="btn" href="/ptsm">Jump</a>

    <div class="footer">
      2025 Evernight的小站
    </div>
  </div>
</body>
</html>
